name: Build RMX2072 KSU

"on":
  workflow_dispatch:
    inputs:
      boot_img_url_or_path:https://github.com/zhangyuhaha19260817/rmx2072-ksu-build/releases/download/v1.0/boot.F20.img
        description: "Boot image URL or path (default: auto detect from Releases)"
        required: false
        default: "auto"
      ksu_mode:
        description: "KernelSU mode (manual or kprobe)"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    name: Build RMX2072 F20 KernelSU v0.9.5
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build KernelSU and Repack Boot Image
        env:
          INPUT_BOOT: ${{ inputs.boot_img_url_or_path }}
          KSU_MODE: ${{ inputs.ksu_mode }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" | base64 -d > /tmp/run_build.sh
          chmod +x /tmp/run_build.sh
          bash /tmp/run_build.sh

      - name: Upload Compiled Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: RMX2072-F20-KernelSU-v0.9.5
          path: |
            output_artifacts/boot_RMX2072_F20_KSU_v0.9.5.img
            output_artifacts/AnyKernel3_RMX2072_F20_KSU_v0.9.5.zip
            output_artifacts/Image
          retention-days: 30
